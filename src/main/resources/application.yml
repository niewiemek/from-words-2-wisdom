#Thu Oct 10 21:21:47 UTC 2024
micronaut:
  application:
    name: From words 2 wisdom
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  server:
    netty:
      compression-threshold: -1
---
embeddings-store:
  host: localhost
  port: 6334
  collection: wisdom_small
  query:
    maxResults: 7
    minScore: 0.8
---
model:
  embedding:
    name: mxbai-embed-large
    baseUrl: http://localhost:11434/
  chat:
    llama:
      name: llama3.2
      baseUrl: http://localhost:11434/
    remote:
      name: gcp/claude-sonnet-4-5
      baseUrl: ${OPENAI_API_URL}
      apiKey: ${OPENAI_API_KEY}
